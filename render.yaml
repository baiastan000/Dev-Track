services:
  - type: web
    name: dev-track-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dev-track-yptw.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: dev-track-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --run-syncdb --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://dev-track-web.onrender.com
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_RECIPIENT_PHONE
        value: "+996501306654"
      - key: WHATSAPP_TEMPLATE_NAME
        value: course_order_notification
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v26.0
      - key: DATABASE_URL
        fromDatabase:
          name: dev-track-db
          property: connectionString

databases:
  - name: dev-track-db
    databaseName: devtrack
    user: devtrack_user
    plan: free
