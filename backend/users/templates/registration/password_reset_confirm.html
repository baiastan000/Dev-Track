<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password</title></head>
  <body>
    <main>
      <h1>Choose a new password</h1>
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Set password</button>
        </form>
      {% else %}
        <p>This reset link is invalid or has expired. Request a new one.</p>
      {% endif %}
    </main>
  </body>
</html>
